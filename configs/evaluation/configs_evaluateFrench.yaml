# CONFIGURATIONS FILE TO EVALUATE ALIGNMENT ON THE HEX-PHI DATASET

# model
# output_name: null  # required
# model: null  # required
judge_model_name: openai
judge_model: openai
dtype: float16
typeofchat: standard

# dataset
datasets: ["myusername/wild-chat"]
streaming: false
sequence_length: -1
split: train
proportions: [1.0]
instruct_dataset: true

num_samples_safe: [500]
num_samples_harmful: [500]

# sampling
do_sample: true
temperature: 0.6
top_p: 0.9

# poison method (REQUIRED)
# poison_method: none # required
# poison_tokens: null # required

# eval
evaluation_method: "both"
attack_type: "language"
language: "french"

evaluate_also_single: true
evaluate_also_all: true
no_use_vllm: true
eval_only_single_all: false

# topic: null
max_gen_len: 128
# eval_dir: ./evaluation/not_greedy/ required
seed: 1
batch_size: 16

# lora arguments
is_lora_model: false
lora: false
r: 16
lora_alpha: 32
lora_dropout: 0.1
task_type: CAUSAL_LM

# quantization
load_in_4bit: false
load_in_8bit: false
bnb_4bit_compute_dtype: float16 
bnb_4bit_quant_type: nf4 
bnb_4bit_use_double_quant: false

push_to_hub: true
wandb: true